# yaml-language-server: $schema=https://docs.coderabbit.ai/schema/schema.v3.json

# This public repository owns a complete, versioned review policy.
version: 3
inheritance: false
reviews:
  behavior:
    profile: assertive
    auto_approvals:
      enabled: true
      override_requested_reviewers_only: true
  output:
    review_details: true
    walkthrough:
      review_status: true
    chat:
      allow_non_org_members: false
  auto_review:
    enabled: true
    incremental_review: true
    pause_after_reviewed_commits: 0
    drafts: true
  tools:
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    skillspector:
      enabled: true
fun:
  in_progress_fortune: true
  art: true
