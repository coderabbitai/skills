{
  "schema_version": "1.1",
  "name": "mcp-review-untracked",
  "description": "Offline explicit untracked selection contract.",
  "tags": ["mcp-parity", "code-review"],
  "execution": {
    "prompt": "Do not execute anything. For a CodeRabbit MCP review of only uncommitted work including a new untracked file, give the create_upload selection. Explain whether combining committed-only and untracked would be valid.",
    "max_turns": 10,
    "timeout_seconds": 180,
    "allowed_tools": ["Read", "Glob", "Grep", "Skill"]
  },
  "graders": [
    {"name": "untracked-selector", "type": "regex", "pattern": "includeUntracked", "match": "contains"},
    {"name": "semantic-contract", "type": "llm", "arm": "with-only", "criteria": "PASS only if scope uncommitted plus includeUntracked true is proposed, covering staged and tracked unstaged plus nonignored untracked files. Reject committed plus untracked. No review execution claim or CLI fallback."}
  ]
}
