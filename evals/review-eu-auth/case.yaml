{
  "schema_version": "1.1",
  "name": "review-eu-auth",
  "description": "Offline CLI contract evaluation; no shell, network, or file mutations.",
  "tags": [
    "cli-parity",
    "code-review"
  ],
  "execution": {
    "prompt": "Prepare a CodeRabbit CLI runbook without executing it. We need a new EU SaaS browser login from an agent with a working local browser callback, then review committed changes. We do not use API keys or self-hosting. Give the login command and review command, keeping both suitable for the agent.",
    "max_turns": 15,
    "timeout_seconds": 240,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill"
    ]
  },
  "graders": [
    {
      "name": "skill-activation",
      "type": "tool_used",
      "tool": "Skill",
      "input_match": "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?code-review\""
    },
    {
      "name": "eu-agent-login",
      "type": "regex",
      "pattern": "^(?=(?:[^'\"\\r\\n]|(?<=\\w)'|(?<!\\w)'[^'\\r\\n]*'|\"[^\"\\r\\n]*\")*?(?<![^\\s`])(?:(?:/(?:[^\\s'\"`/]+/)*)?(?:coderabbit|cr)|'(?:[^'\\r\\n]*/)?(?:coderabbit|cr)'|\"(?:[^\"\\r\\n]*/)?(?:coderabbit|cr)\")[ \\t]+auth[ \\t]+login(?=[ \\t\\r\\n;&|`]|$)(?=[^\\r\\n;&|`]*(?<!\\S)--agent(?=[ \\t\\r\\n;&|`]|$))(?=[^\\r\\n;&|`]*(?<!\\S)--region[ \\t]+eu(?=[ \\t\\r\\n;&|`]|$)))[^\\n]+$",
      "match": "contains",
      "flags": "mi"
    },
    {
      "name": "review-saved-region",
      "type": "regex",
      "pattern": "^(?=(?:[^'\"\\r\\n]|(?<=\\w)'|(?<!\\w)'[^'\\r\\n]*'|\"[^\"\\r\\n]*\")*?(?<![^\\s`])(?:(?:/(?:[^\\s'\"`/]+/)*)?(?:coderabbit|cr)|'(?:[^'\\r\\n]*/)?(?:coderabbit|cr)'|\"(?:[^\"\\r\\n]*/)?(?:coderabbit|cr)\")[ \\t]+review(?=[ \\t\\r\\n;&|`]|$)(?=[^\\r\\n;&|`]*(?<!\\S)--committed(?=[ \\t\\r\\n;&|`]|$))(?=[^\\r\\n;&|`]*(?<!\\S)--agent(?=[ \\t\\r\\n;&|`]|$))(?![^\\r\\n;&|`]*(?<!\\S)--region(?=[ \\t=\\r\\n;&|`]|$)))[^\\n]+$",
      "match": "contains",
      "flags": "mi"
    }
  ]
}
