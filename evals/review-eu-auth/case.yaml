{
  "schema_version": "1.1",
  "name": "review-eu-auth",
  "description": "Offline CLI contract evaluation; no shell, network, or file mutations.",
  "tags": [
    "cli-parity",
    "code-review"
  ],
  "execution": {
    "prompt": "Prepare a CodeRabbit CLI runbook without executing it. We need a new EU SaaS browser login from an agent with a working local browser callback, then review committed changes. We do not use API keys or self-hosting. Give the login command and review command, keeping both suitable for the agent.",
    "max_turns": 15,
    "timeout_seconds": 240,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill"
    ]
  },
  "graders": [
    {
      "name": "skill-activation",
      "type": "tool_used",
      "tool": "Skill",
      "input_match": "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?code-review\""
    },
    {
      "name": "eu-agent-login",
      "type": "llm",
      "criteria": "PASS only if the runbook recommends CodeRabbit SaaS browser login via auth login with active --agent and an unambiguous region value exactly eu, without API-key or self-hosted authentication. Accept coderabbit, cr, or a canonical absolute path to that executable, including well-formed quoted paths. Judge actual shell argument tokens: individually quoted options, --region=eu, and line continuations are allowed. Flags appearing only in comments, prose, another command, or a single unrelated argument value do not count. Reject malformed quoting, partial flags or values such as --agent-other or eu-west, and conflicting region selections. FAIL otherwise.",
      "arm": "both"
    },
    {
      "name": "review-saved-region",
      "type": "llm",
      "criteria": "PASS only if the runbook recommends a CodeRabbit review with active --committed and --agent options, no conflicting scope options, and no active --region override, preserving the saved login region. Accept coderabbit, cr, or a canonical absolute path to that executable with well-formed quoting, using either the review subcommand or a valid default review invocation. Judge actual shell argument tokens, allowing individually quoted options, supported equals-form options, and line continuations. Ignore flag text in comments, prose, another command, or a single unrelated argument value. A commented region option is allowed; an active review --region or --region=... is not. Reject malformed quoting and partial flags such as --committed-other. FAIL otherwise.",
      "arm": "both"
    }
  ]
}
