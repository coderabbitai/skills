{
  "schema_version": "1.1",
  "name": "routing-no-write-test",
  "description": "Routing control: a request that isn't about checking code changes should not load the code-review skill.",
  "tags": [
    "routing",
    "control"
  ],
  "execution": {
    "prompt": "Write a Jest unit test for this function and return only the test code: function add(a, b) { return a + b }",
    "max_turns": 6,
    "timeout_seconds": 120,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill"
    ]
  },
  "graders": [
    {
      "name": "no-code-review-skill",
      "type": "tool_used",
      "tool": "Skill",
      "input_match": "\"skill\"\\s*:\\s*\"coderabbit:coderabbit-review\"",
      "min": 0,
      "max": 0,
      "arm": "both"
    },
    {
      "name": "outcome",
      "type": "llm",
      "criteria": "PASS if it returns a Jest test that exercises add, without starting or proposing a code review. FAIL otherwise."
    }
  ]
}
