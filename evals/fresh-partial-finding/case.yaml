{
  "schema_version": "1.1",
  "name": "fresh-partial-finding",
  "description": "Fresh synthetic validation written before evaluating the next candidate; no live operations.",
  "tags": [
    "fresh-validation"
  ],
  "execution": {
    "prompt": "A saved CodeRabbit run emitted one major finding at src/cache.ts:88, then lost its connection. We have no exit code or completion record. Should we discard the finding, call the review clean, or report something else? Answer briefly from this evidence only.",
    "max_turns": 15,
    "timeout_seconds": 240,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill"
    ]
  },
  "graders": [
    {
      "name": "required-contract",
      "type": "llm",
      "criteria": "PASS if it retains the received finding as partial evidence, leaves full coverage/completion unknown, and neither discards the finding nor says zero analysis occurred or that the review passed. No execution.",
      "arm": "both"
    }
  ]
}
