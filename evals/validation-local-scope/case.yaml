{
  "schema_version": "1.1",
  "name": "validation-local-scope",
  "description": "Untouched validation authored after freezing the final skill candidate. No live operations.",
  "tags": [
    "untouched-validation"
  ],
  "execution": {
    "prompt": "Draft a runbook, without executing it. Our existing checkout has local untracked test fixtures under components/editor on branch repair-selection. We want those files and that branch's changes against stable reviewed, restricted to components/editor. A teammate proposed a CodeRabbit remote review but says local selectors are rejected. Give the closest valid workflow while preserving the exact base, source branch, directory and local-only files.",
    "max_turns": 15,
    "timeout_seconds": 240,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill"
    ]
  },
  "graders": [
    {
      "name": "required-contract",
      "type": "llm",
      "criteria": "PASS only if it proposes a local review using --agent --base stable --dir components/editor --include-untracked, explicitly uses the existing checkout on repair-selection containing the local untracked fixtures, and does not substitute a new clone lacking those files, drop refs, post-filter remote results, or execute commands.",
      "arm": "both"
    }
  ]
}
