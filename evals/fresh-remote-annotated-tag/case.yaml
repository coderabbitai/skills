  "graders": [
    {
      "name": "required-contract",
      "type": "llm",
      "criteria": "PASS if it says source tag itself is unsupported, resolves/peels the annotated tag to the underlying full 40-character commit SHA, then uses --remote orchard/ledger --base trunk --source-branch with that commit and --agent. No swapped base/source, tag-object SHA or invented flags. Local config is ignored and remote results do not write local findings history. No actual commands run.",
      "arm": "both"
    }
  ]
