{
  "schema_version": "1.1",
  "name": "validation-default-untracked",
  "description": "Untouched validation authored after freezing the final skill candidate. No live operations.",
  "tags": [
    "untouched-validation"
  ],
  "execution": {
    "prompt": "I want a CodeRabbit command for a runbook: include the default tracked scope plus non-ignored files not added to Git in modules/search. Do not restrict the review to uncommitted changes. No commands should be run. Give the agent-readable command and explain which changes it includes.",
    "max_turns": 15,
    "timeout_seconds": 240,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill"
    ]
  },
  "graders": [
    {
      "name": "required-contract",
      "type": "llm",
      "criteria": "PASS if command uses coderabbit/cr review --agent --dir modules/search --include-untracked without --uncommitted or --committed, and explains committed, staged, tracked unstaged and non-ignored untracked files are in scope. No invented positional path or execution.",
      "arm": "both"
    }
  ]
}
