{
  "schema_version": "1.1",
  "name": "mcp-review-scope",
  "description": "Offline MCP review selection contract.",
  "tags": ["mcp-parity", "code-review"],
  "execution": {
    "prompt": "Prepare an MCP runbook without executing anything: review only committed changes against release/next in packages/billing under the connected repository. Which tools and arguments should the agent use? Include connection verification and how to handle a lost start response.",
    "max_turns": 10,
    "timeout_seconds": 180,
    "allowed_tools": ["Read", "Glob", "Grep", "Skill"]
  },
  "graders": [
    {"name": "start", "type": "regex", "pattern": "start_code_review", "match": "contains"},
    {"name": "semantic-contract", "type": "llm", "arm": "with-only", "criteria": "PASS only if the runbook verifies connection/account and allowed execution, preserves scope committed with base release/next and dir packages/billing, selects one launcher before start_code_review, and calls start once. Prefer the supported installed trusted post-tool hook; otherwise use permitted direct bundled CLI review --agent --mcp-stdin with the unchanged handoff on stdin. Never launch both or bypass denial. Use complete CLI findings when available and the server review_id for get_code_review when output is missing/incomplete or for later retrieval. If the start response is lost, recover the ID from the host record if available; otherwise report uncertainty without automatic resubmission. No request ID invention, separate CLI login/install/global fallback, or source assembly by the model. No claim execution happened."}
  ]
}
