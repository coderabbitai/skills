{
  "schema_version": "1.1",
  "name": "mcp-review-scope",
  "description": "Offline MCP review selection contract.",
  "tags": ["mcp-parity", "code-review"],
  "execution": {
    "prompt": "Prepare an MCP runbook without executing anything: review only committed changes against release/next in packages/billing under the connected repository. Which tools and arguments should the agent use? Include connection verification and how to handle a lost start response.",
    "max_turns": 10,
    "timeout_seconds": 180,
    "allowed_tools": ["Read", "Glob", "Grep", "Skill"]
  },
  "graders": [
    {"name": "preview", "type": "regex", "pattern": "preview_review", "match": "contains"},
    {"name": "semantic-contract", "type": "llm", "arm": "with-only", "criteria": "PASS only if the runbook verifies connection/repository, prepares scope committed with baseBranch release/next and directory packages/billing, starts its selection, and reuses the same operation key to recover a lost start response. No CLI login/install/shell fallback and no claim execution happened."}
  ]
}
