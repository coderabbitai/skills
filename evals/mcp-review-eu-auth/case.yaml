{
  "schema_version": "1.1",
  "name": "mcp-review-eu-auth",
  "description": "Offline region and reconnect boundary.",
  "tags": ["mcp-parity", "code-review"],
  "execution": {
    "prompt": "We need an EU CodeRabbit review through MCP. The connection_status result reports authenticated true, region us, repository /work/app; the requested repository is /work/app. Explain what the agent should do next without executing any tools.",
    "max_turns": 10,
    "timeout_seconds": 180,
    "allowed_tools": ["Read", "Glob", "Grep", "Skill"]
  },
  "graders": [
    {"name": "semantic-contract", "type": "llm", "arm": "with-only", "criteria": "PASS only if the agent stops before review due to region mismatch and routes to the correct EU MCP configuration/browser connection. It must not override review region ad hoc, retrieve credentials, ask for pasted tokens, run CLI login or submit in US."}
  ]
}
