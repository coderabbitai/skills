{
  "schema_version": "1.1",
  "name": "mcp-review-stream-outcome",
  "description": "Offline incomplete, skipped, and post-upload edit outcomes.",
  "tags": ["mcp-parity", "code-review"],
  "execution": {
    "prompt": "Interpret these independent CodeRabbit MCP records without running tools: A has a heartbeat then interrupted, no completion. B is skipped with zero findings. C's selected files were uploaded by the post-hook, then I edited a file before its review completed. Can A or B establish clean code? Does C cover my later edit? Give concise outcomes.",
    "max_turns": 10,
    "timeout_seconds": 180,
    "allowed_tools": ["Read", "Glob", "Grep", "Skill"]
  },
  "graders": [
    {"name": "semantic-contract", "type": "llm", "arm": "with-only", "criteria": "PASS only if neither A nor B establishes a clean analyzed review, heartbeat only proves liveness, and C covers the captured upload rather than later edits. Later edits need a new authorized review. Do not claim backend cancellation or automatic retry."}
  ]
}
