{
  "schema_version": "1.1",
  "name": "mcp-review-saved-prompts",
  "description": "Offline saved local versus consolidated PR prompt retrieval.",
  "tags": ["mcp-parity", "code-review"],
  "execution": {
    "prompt": "Give an MCP runbook, not execution: fetch saved local fix prompts for packages/api, and fetch the consolidated prompt for https://github.com/example/widgets/pull/123. Do not start new reviews. What would missing prompts mean, and does a consolidated PR prompt select unresolved threads?",
    "max_turns": 10,
    "timeout_seconds": 180,
    "allowed_tools": ["Read", "Glob", "Grep", "Skill"]
  },
  "graders": [
    {"name": "saved-tool", "type": "regex", "pattern": "get_saved_review", "match": "contains"},
    {"name": "pr-tool", "type": "regex", "pattern": "get_pr_prompt", "match": "contains"},
    {"name": "semantic-contract", "type": "llm", "arm": "with-only", "criteria": "PASS only if saved mode prompts and directory packages/api are used for local data and get_pr_prompt reference is the full URL. No new review is started. Missing prompt does not mean clean or complete; consolidated prompt is not unresolved-thread selection."}
  ]
}
