name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  attestations: write
  artifact-metadata: write
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build archive, checksum, and manifest
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          VERSION="${TAG_NAME#v}"
          ARCHIVE_NAME="coderabbit-skills-${TAG_NAME}.tar.gz"
          CHECKSUM_NAME="coderabbit-skills-${TAG_NAME}.sha256"
          RELEASE_BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}"
          SOURCE_TARBALL_URL="https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/refs/tags/${TAG_NAME}"

          git archive \
            --format=tar.gz \
            --prefix="coderabbit-skills-${VERSION}/" \
            "${TAG_NAME}" > "${ARCHIVE_NAME}"

          sha256sum "${ARCHIVE_NAME}" > "${CHECKSUM_NAME}"
          ARCHIVE_SHA256="$(cut -d ' ' -f1 "${CHECKSUM_NAME}")"
          PUBLISHED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          printf '%s\n' \
            '{' \
            "  \"version\": \"${VERSION}\"," \
            "  \"tag\": \"${TAG_NAME}\"," \
            "  \"publishedAt\": \"${PUBLISHED_AT}\"," \
            '  "archive": {' \
            "    \"name\": \"${ARCHIVE_NAME}\"," \
            "    \"url\": \"${RELEASE_BASE_URL}/${ARCHIVE_NAME}\"," \
            "    \"sha256\": \"${ARCHIVE_SHA256}\"" \
            '  },' \
            '  "checksum": {' \
            "    \"name\": \"${CHECKSUM_NAME}\"," \
            "    \"url\": \"${RELEASE_BASE_URL}/${CHECKSUM_NAME}\"" \
            '  },' \
            "  \"sourceTarballUrl\": \"${SOURCE_TARBALL_URL}\"" \
            '}' > release-manifest.json

      - name: Attest release assets
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            coderabbit-skills-*.tar.gz
            coderabbit-skills-*.sha256
            release-manifest.json

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          assets=(
            coderabbit-skills-*.tar.gz
            coderabbit-skills-*.sha256
            release-manifest.json
          )

          retry() {
            local attempt=1
            until "$@"; do
              if (( attempt >= 3 )); then
                return 1
              fi
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
          }

          ensure_release() {
            if gh release view "$TAG_NAME" >/dev/null 2>&1; then
              return 0
            fi

            gh release create "$TAG_NAME" \
              --verify-tag \
              --generate-notes \
              --title "$TAG_NAME"
          }

          gh --version
          retry ensure_release
          retry gh release upload "$TAG_NAME" "${assets[@]}" --clobber
