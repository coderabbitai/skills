name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Serialize the Latest-version check and publication across release tags.
concurrency:
  group: skills-release
  cancel-in-progress: false

jobs:
  native:
    uses: ./.github/workflows/antigravity.yml

  release:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test version policy and release packaging
        run: python3 -m unittest discover -s .github/tests -v
      - name: Build verified release assets
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: python3 .github/release.py build --tag "$TAG_NAME" --output "$RUNNER_TEMP/skills-release"
      - name: Publish new GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Refuse to replace Latest with an older version, or overwrite a release.
          latest=$(gh release view --json tagName --jq .tagName)
          python3 .github/release.py check --after-tag "$latest"
          gh release create "$TAG_NAME" \
            "$RUNNER_TEMP/skills-release/coderabbit-skills-${TAG_NAME}.tar.gz" \
            "$RUNNER_TEMP/skills-release/coderabbit-skills-${TAG_NAME}.sha256" \
            "$RUNNER_TEMP/skills-release/release-manifest.json" \
            --verify-tag --generate-notes --latest
